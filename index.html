<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ลงทะเบียนใช้งาน Line Tidlor Academy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="d-flex align-items-center h-100">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <h1 class="text-center fw-bold">
            ลงทะเบียนใช้งาน Line OA<br />Tidlor Academy
          </h1>
          <form id="stripe-login" method="post" name="myForm">
            <div class="form-group">
              <label for="codeId">รหัสพนักงาน</label>
              <div id="codeIdHelp" class="d-inline text-danger form-text">
                *พนักงานประจำเปลี่ยน CF เป็น 10*
              </div>
              <input type="text" class="form-control" aria-describedby="codeIdHelp" id="codeId" name="codeId"
                maxlength="8" placeholder="กรุณากรอกรหัสพนักงาน 8 ตัวอักษร" />
            </div>
            <div class="form-group mt-3">
              <label for="nameEn">ชื่อภาษาอังกฤษ</label>
              <input type="text" class="form-control" id="nameEn" name="nameEn"
                placeholder="กรุณากรอกชื่อภาษาอังกฤษเท่านั้น" />
            </div>
            <div class="text-center">
              <input type="submit" id="btn" value="บันทึกข้อมูล" class="btn w-100 mt-4" />
              <p id="loading-text" style="display: none; margin-top: 10px">
                รอสักครู่ ระบบกำลังทำการบันทึกข้อมูลของคุณ...
              </p>
            </div>
          </form>
          <div id="success-message" style="display: none; text-align: center; margin-top: 20px">
            <h4>ลงทะเบียนสำเร็จ</h4>
            <img src="https://cdn.glitch.global/3fce8920-b546-482f-a5c0-8c7e9f8fd3dc/thank%20(1).png?v=1745827421793"
              class="img-fluid" />
            <p class="mb-0">ขอบคุณค่ะ</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- script liff sdk -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    const liffId = "2007338293-EQMW98MY";
    const scriptURL =
      "https://script.google.com/macros/s/AKfycbyA6ga9BO81wtPUNHkE17te3RrGQnIqS3MTnUnL7gtiz5kxa9Q2k6ikcOGkfUsg_CWVbA/exec";
    let userId = "";
    let isSubmitBound = false;

    function main() {
      liff.init({liffId: liffId});
      liff.ready.then(() => {
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        liff.getProfile().then((profile) => {
          userId = profile.userId;
          console.log("Profile:", profile);

          if (!isSubmitBound) {
            const form = document.forms["myForm"];
            const submitButton = document.getElementById("btn");
            const loadingText = document.getElementById("loading-text");
            const successMessage = document.getElementById("success-message");

            form.addEventListener("submit", (e) => {
              e.preventDefault();
              console.log("Form submission started");

              submitButton.style.display = "none";
              loadingText.style.display = "block";

              const formData = new FormData(form);
              formData.append("userId", userId);

              const codeId = form.querySelector("#codeId")?.value.trim();
              const nameEn = form.querySelector("#nameEn")?.value.trim();

              if (!codeId || !nameEn) {
                alert("กรุณากรอกข้อมูลให้ครบทุกช่อง");
                submitButton.style.display = "inline-block";
                loadingText.style.display = "none";
                return;
              }

              fetch(scriptURL, {
                method: "POST",
                mode: "no-cors",
                body: formData,
              })
                .then((response) => {
                  console.log("Form submitted successfully", response);
                  form.style.display = "none";
                  loadingText.style.display = "none";
                  successMessage.style.display = "block";
                })
                .catch((error) => {
                  console.error("Error!", error.message);
                  alert("เกิดข้อผิดพลาด กรุณาลองใหม่");
                  submitButton.style.display = "inline-block";
                  loadingText.style.display = "none";
                });
            });

            isSubmitBound = true;
          }
        });
      });
    }
    main();
  </script>
</body>

</html>
